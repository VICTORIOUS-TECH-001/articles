<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon · Devs at Work</title>
     <link rel="icon" type="image/png" href="./src/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./src/images/favicon.svg" />
    <link rel="shortcut icon" href="./src/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./src/images/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 30%, #0b0f1f, #03050b);
            font-family: 'Inter', sans-serif;
            padding: 1.5rem;
        }

        .card {
            max-width: 820px;
            width: 100%;
            background: rgba(18, 25, 45, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 3.5rem;
            padding: 3.5rem 2.5rem;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(90, 140, 255, 0.15);
            transition: box-shadow 0.3s ease;
            text-align: center;
            border: 1px solid rgba(120, 180, 255, 0.08);
        }

        .card:hover {
            box-shadow: 0 40px 70px -18px #1e3a8a40, 0 0 0 1px rgba(100, 180, 255, 0.25);
        }

        /* ---- animated glow (coming soon) ---- */
        .glow-text {
            font-size: clamp(2.8rem, 12vw, 5.2rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #b7d9ff, #7bb3ff, #5b9aff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(70, 140, 255, 0.3);
            animation: breatheGlow 3s ease-in-out infinite alternate;
            display: inline-block;
            margin-bottom: 0.15em;
        }

        @keyframes breatheGlow {
            0% { text-shadow: 0 0 20px rgba(60, 130, 255, 0.2), 0 0 40px rgba(60, 130, 255, 0.05); transform: scale(1); }
            100% { text-shadow: 0 0 50px rgba(90, 170, 255, 0.6), 0 0 90px #3b82f670; transform: scale(1.02); }
        }

        .subhead {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            font-weight: 400;
            color: rgba(210, 230, 255, 0.8);
            letter-spacing: 0.3px;
            margin-top: -0.2rem;
            margin-bottom: 2.2rem;
            border-bottom: 1px dashed rgba(100, 170, 255, 0.2);
            padding-bottom: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .subhead span {
            background: rgba(60, 130, 255, 0.12);
            padding: 0.2rem 1rem;
            border-radius: 60px;
            font-weight: 500;
            color: #b0d0ff;
            border: 1px solid rgba(80, 160, 255, 0.15);
            backdrop-filter: blur(4px);
        }

        /* ---- engineers at work - animated typewriter + pulse ---- */
        .engineer-line {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem 0.75rem;
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 600;
            color: #e8f0ff;
            background: rgba(0, 20, 60, 0.3);
            padding: 0.8rem 2rem;
            border-radius: 80px;
            margin-bottom: 2.5rem;
            border: 1px solid rgba(100, 180, 255, 0.15);
            backdrop-filter: blur(2px);
            box-shadow: 0 10px 30px -12px #0a142f;
        }

        .engineer-line .emoji-big {
            font-size: 1.9rem;
            line-height: 1;
            filter: drop-shadow(0 0 10px #5b9aff60);
            animation: floatY 2.4s ease-in-out infinite;
        }

        @keyframes floatY {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        .typewriter {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid #6aabff;
            animation: blinkCursor 0.9s step-end infinite, type 3.2s steps(30) 1s forwards;
            width: 0;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #d6e9ff;
        }

        @keyframes type {
            0% { width: 0; }
            100% { width: 100%; }
        }

        @keyframes blinkCursor {
            0%, 100% { border-color: #6aabff; }
            50% { border-color: transparent; }
        }

        .typewriter-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ---- patience message + animated gear ---- */
        .patience-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            flex-wrap: wrap;
            background: rgba(0, 10, 30, 0.4);
            border-radius: 60px;
            padding: 0.6rem 1.8rem 0.6rem 1.4rem;
            border: 1px solid rgba(80, 150, 255, 0.15);
            backdrop-filter: blur(2px);
            margin: 0 auto 1.8rem;
            width: fit-content;
        }

        .patience-box span {
            font-size: clamp(0.95rem, 1.8vw, 1.3rem);
            font-weight: 400;
            color: #b8d0f0;
            letter-spacing: 0.2px;
        }

        .gear-icon {
            display: inline-block;
            font-size: 2rem;
            animation: spinGear 6s linear infinite;
            filter: drop-shadow(0 0 6px #4a8eff70);
        }

        @keyframes spinGear {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ---- progress / status bar (animated) ---- */
        .status-bar {
            margin-top: 2.2rem;
            background: rgba(20, 40, 80, 0.4);
            border-radius: 40px;
            padding: 0.2rem;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(100, 170, 255, 0.1);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
        }

        .status-fill {
            height: 10px;
            border-radius: 40px;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #8ab4ff, #3b82f6);
            background-size: 200% 100%;
            animation: fillProgress 3.8s ease-in-out infinite alternate, shimmer 5s ease-in-out infinite;
            box-shadow: 0 0 20px #3b82f670;
        }

        @keyframes fillProgress {
            0% { width: 15%; }
            50% { width: 72%; }
            100% { width: 88%; }
        }

        @keyframes shimmer {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        .status-label {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
            padding: 0 0.3rem;
            font-size: 0.7rem;
            font-weight: 500;
            color: #7b9fd0;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .status-label span:last-child {
            color: #9bbef5;
            font-weight: 600;
        }

        /* ---- extra animated doodle (floating dots) ---- */
        .doodle-dots {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin: 2.2rem 0 0.4rem;
            opacity: 0.5;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #5f93ff;
            border-radius: 50%;
            animation: dotPulse 2.2s ease-in-out infinite;
            box-shadow: 0 0 12px #2f7aff;
        }

        .dot:nth-child(2) { animation-delay: 0.4s; }
        .dot:nth-child(3) { animation-delay: 0.9s; }
        .dot:nth-child(4) { animation-delay: 0.2s; }
        .dot:nth-child(5) { animation-delay: 0.7s; }

        @keyframes dotPulse {
            0%, 100% { transform: scale(0.5); opacity: 0.2; }
            50% { transform: scale(1.4); opacity: 1; background: #8bb6ff; }
        }

        /* ---- responsive fine-tune ---- */
        @media (max-width: 500px) {
            .card { padding: 2.2rem 1.2rem; border-radius: 2.5rem; }
            .engineer-line { padding: 0.6rem 1.2rem; gap: 0.3rem; }
            .typewriter { white-space: normal; border-right: none; animation: none; width: auto; }
            .typewriter-wrapper { display: inline; }
            .gear-icon { font-size: 1.6rem; }
            .patience-box { padding: 0.3rem 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- COMING SOON (animated glow) -->
        <h1 class="glow-text">✦ COMING SOON ✦</h1>

        <!-- subhead with a little flair -->
        <div class="subhead">
            <span>🚀</span> 
            <span>Victorious Tech</span>
            <span>✨</span>
        </div>
        <!-- Software Engineers at work (typewriter + emoji) -->
        <div class="engineer-line">
            <span class="emoji-big">👩‍💻</span>
            <span class="emoji-big">👨‍💻</span>
            <div class="typewriter-wrapper">
                <span class="typewriter">Victorious Software Engineers are at work</span>
            </div>
            <span style="font-size: 1.1rem; opacity:0.8;">⚡</span>
        </div>
        <!-- patience message + animated gear -->
        <div class="patience-box">
            <span class="gear-icon">⚙️</span>
            <span>Have patience ·</span>
            <span style="font-weight:300; color:#b0ceff;">building something brilliant</span>
            <span style="font-size:1.4rem; margin-left: 0.2rem;">🌀</span>
        </div>
        <div class="status-bar">
            <div class="status-fill"></div>
        </div>
        <div class="status-label">
            <span>deploying awesomeness</span>
            <span id="progressPercentage">~ 72%</span>
        </div>
        <div class="doodle-dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
        <p style="margin-top: 1.8rem; font-size: 0.7rem; color: #3e6190; letter-spacing: 1px; border-top: 1px solid #1c325a; padding-top: 1.2rem; opacity:0.8;">
            <span style="display: inline-block; animation: floatY 3s infinite;">⏳</span> 
            &nbsp; zero downtime · full focus &nbsp; 
            <span style="display: inline-block; animation: floatY 3s infinite 0.6s;">⏳</span>
        </p>
    </div>

    <!-- tiny script to update progress text (just for fun) -->
    <script>
        (function() {
            const progressLabel = document.getElementById('progressPercentage');
            if (!progressLabel) return;

            let step = 0;
            const messages = ['~ 18%', '~ 34%', '~ 52%', '~ 67%', '~ 72%', '~ 81%', '~ 89%', '~ 94%', '~ 99%', '✨ almost there'];
            const statusFill = document.querySelector('.status-fill');

            function updateProgress() {
                const currentWidth = window.getComputedStyle(statusFill).width;
                const parentWidth = statusFill.parentElement.clientWidth;
                let ratio = 0.72; 

                if (parentWidth > 0) {
                    const widthPx = parseFloat(currentWidth);
                    if (!isNaN(widthPx)) {
                        ratio = Math.min(widthPx / parentWidth, 0.95);
                    }
                }
                
                // map ratio to message index
                const idx = Math.min(Math.floor(ratio * messages.length), messages.length - 1);
                progressLabel.textContent = messages[idx] || '~ 72%';
            }

            // update on animation frame (smooth)
            let ticking = false;
            const observer = new MutationObserver(() => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        updateProgress();
                        ticking = false;
                    });
                    ticking = true;
                }
            });

            // observe the fill width changes
            const fillElement = document.querySelector('.status-fill');
            if (fillElement) {
                observer.observe(fillElement, { attributes: true, attributeFilter: ['style'] });
                // also update on resize
                window.addEventListener('resize', updateProgress);
                // initial
                setTimeout(updateProgress, 500);
            }
        })();
    </script>
</body>
</html>
