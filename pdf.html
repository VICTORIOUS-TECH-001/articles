<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>📚 Course Slides</title>
    <link rel="icon" type="image/png" href="./src/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./src/images/favicon.svg" />
    <link rel="shortcut icon" href="./src/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./src/images/apple-touch-icon.png" />
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="./src/css/pdf.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <header class="library-header">
        <div class="container">
            <div class="brand">
                <span class="brand-icon">📚</span>
                <div>
                    <h1>
                        Course Slides
                    </h1>
                </div>
            </div>
            <div class="header-stats">
                <span class="stat-item">
                    📖 <strong id="totalBooks">0</strong>
                </span>
                <span class="stat-divider"></span>
                <span class="stat-item">
                    🔍 <strong id="visibleCount">0</strong>
                </span>
            </div>
        </div>
    </header>

    <!-- ====== TOOLBAR ====== -->
    <div class="toolbar">
        <div class="search-wrap">
            <span class="search-icon">🔎</span>
            <input type="text" id="searchInput" placeholder="Search Topics and view slides" autocomplete="off" />
        </div>
        <div class="filter-group">
            <span class="filter-label">Filter:</span>
            <button class="filter-chip active" data-filter="all">All</button>
            <button class="filter-chip" data-filter="sources">📕 Sources</button>
            <button class="filter-chip" data-filter="interpret">📊 Reasoning</button>
            <button class="filter-chip" data-filter="interpetation">⚖️ Interpretation</button>
            <button class="filter-chip" data-filter="reference">✍️ Brief Writing</button>
            <button class="filter-chip" data-filter="methodology">📘 Methodology</button>
        </div>
    </div>

    <!-- ====== BOOKSHELF ====== -->
    <section class="bookshelf">
        <div class="book-grid" id="bookGrid">
            <!-- Rendered by JavaScript -->
        </div>
    </section>
 <footer class="text-center py-8 border-t border-white/5 text-slate-500 text-xs max-w-7xl mx-auto px-4">
    <p> <center>   © 2026 Victorious Tech — Legal Intelligence Hub | Empowering Legal Minds</center></p>
  </footer>
    <script src="./src/JS/pdfs.js"></script>

</body>
</html>
